<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Pagina di servizio raggiunta SOLO dal collegamento personale nella mail
         di invito agli incontri B2B: non va indicizzata e non e' nella sitemap. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Il Suo incontro B2B | Next Generation Business</title>
    <style>
        :root {
            --navy-dark: #0A2844; --navy: #164068; --navy-light: #2A5A85;
            --testo: #1E293B; --tenue: #475569; --bordo: #E2E8F0;
            --sfondo: #F1F5F9; --chiaro: #F4F8FB; --rosso: #B3261E; --verde: #1E7F4F;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background: var(--sfondo); color: var(--testo); line-height: 1.6; }
        .testata { background: var(--navy-dark); padding: 26px 20px; }
        .testata-dentro { max-width: 680px; margin: 0 auto; }
        .testata img { display: block; width: 140px; height: auto; }
        .testata h1 { color: #fff; font-size: 1.6rem; letter-spacing: -0.3px; margin-top: 18px; }
        .testata p { color: #C8DAEA; font-size: 1rem; margin-top: 6px; }
        main { max-width: 680px; margin: 0 auto; padding: 24px 20px 60px; }
        .scheda { background: #fff; border: 1px solid var(--bordo); border-radius: 10px; padding: 22px; margin-top: 18px; }
        .avviso { text-align: center; color: var(--tenue); padding: 30px 10px; }
        .avviso.errore { color: var(--rosso); }
        .riepilogo { background: var(--chiaro); border: 1px solid var(--bordo); border-left: 3px solid var(--navy-light); border-radius: 6px; padding: 12px 16px; font-size: 0.95rem; }
        .temi { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
        .tema { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--bordo); border-radius: 8px; padding: 11px 14px; cursor: pointer; background: #fff; }
        .tema:hover { border-color: var(--navy-light); background: var(--chiaro); }
        .tema input { width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; }
        .tema span { font-size: 0.98rem; }
        .tema-ora { display: block; margin-top: 2px; font-size: 0.88rem; font-weight: bold; color: var(--navy-light); }
        /* --- il modulo dell'azienda: regole, preferenze, esigenze --- */
        .regole { background: var(--chiaro); border: 1px solid var(--bordo); border-radius: 8px; padding: 14px 16px; margin-top: 16px; font-size: 0.95rem; }
        .regole ul { margin: 8px 0 0 18px; padding: 0; }
        .regole li { margin-bottom: 6px; }
        .pref { border: 1px solid var(--bordo); border-radius: 8px; padding: 12px 14px; margin-top: 12px; background: #fff; }
        .pref.bloccata { background: var(--chiaro); border-style: dashed; }
        .pref-et { font-size: 0.92rem; font-weight: bold; color: var(--navy); letter-spacing: 0.01em; }
        .pref-et.grande { margin-top: 22px; font-size: 1.02rem; color: var(--navy); }
        .pref-righe { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .pref-righe select, .esigenza select { font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--bordo); border-radius: 6px; background: #fff; color: var(--testo); flex: 1 1 200px; }
        .mini { font-size: 0.85rem; color: var(--tenue); margin-top: 6px; }
        .esigenza { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .esigenza textarea { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--bordo); border-radius: 6px; flex: 2 1 260px; min-height: 64px; resize: vertical; color: var(--testo); }
        .mini-btn { font: inherit; font-size: 0.9rem; background: none; border: none; color: var(--navy-light); cursor: pointer; padding: 4px 0; text-align: left; }
        .mini-btn[disabled] { color: #94A3B8; cursor: default; }
        .campo { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; }
        .campo label { font-size: 0.85rem; font-weight: bold; color: var(--tenue); }
        .campo textarea { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--bordo); border-radius: 6px; width: 100%; min-height: 110px; resize: vertical; color: var(--testo); }
        .campo textarea:focus { outline: 2px solid var(--navy-light); outline-offset: 1px; }
        .azioni { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .invia { font: inherit; font-size: 1.05rem; font-weight: bold; letter-spacing: 0.3px; color: #fff; background: var(--navy); border: none; border-radius: 6px; padding: 14px 34px; cursor: pointer; }
        .invia:hover { background: var(--navy-dark); }
        .invia[disabled] { opacity: 0.6; cursor: default; }
        .esito { min-height: 22px; font-size: 0.92rem; text-align: center; }
        .esito.ko { color: var(--rosso); font-weight: bold; }
        .fatto { text-align: center; padding: 26px 10px; }
        .fatto .segno { font-size: 2.4rem; color: var(--verde); }
        .fuori-programma { margin-top: 14px; border: 1px solid #f3d4b5; border-left: 3px solid #c46a1e; background: #fdeedd; border-radius: 6px; padding: 12px 16px; font-size: 0.93rem; }
        .fuori-programma b { color: #8a4a12; }
        .fatto h2 { color: var(--navy-dark); margin: 8px 0 6px; }
        .fatto p { color: var(--tenue); }
        /* --- LA RICEVUTA DELL'AZIENDA, dopo il salvataggio ---
           Erano cinque paragrafi centrati uno sotto l'altro: quello che e'
           PRENOTATO DAVVERO e quello che aspetta ancora un orario si leggevano
           con lo stesso peso, e al desk quella differenza e' l'unica che
           conti. Ora sono due blocchi con il loro colore e la loro etichetta -
           verde cio' che c'e', blu cio' che aspetta - e dentro una riga per
           incontro, allineata a sinistra: un elenco si scorre, un paragrafo
           centrato no. */
        .ricevuta { text-align: left; margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
        .ric-blocco { border: 1px solid var(--bordo); border-left: 3px solid var(--verde); border-radius: 8px; padding: 14px 16px; background: var(--chiaro); }
        .ric-blocco.attesa { border-left-color: var(--navy-light); }
        .ric-et { font-size: 0.78rem; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; color: var(--verde); }
        .ric-blocco.attesa .ric-et { color: var(--navy-light); }
        .ric-lista { list-style: none; margin: 10px 0 0; padding: 0; }
        .ric-lista li + li { border-top: 1px solid var(--bordo); margin-top: 10px; padding-top: 10px; }
        .ric-testa { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; justify-content: space-between; }
        .ric-tavolo { font-weight: bold; color: var(--navy-dark); font-size: 0.98rem; }
        .ric-ora { font-weight: bold; color: var(--navy); font-size: 0.95rem; white-space: nowrap; }
        .ric-pos { font-size: 0.78rem; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tenue); white-space: nowrap; }
        .ric-chi { font-size: 0.86rem; color: var(--tenue); margin-top: 2px; }
        .fatto .ric-nota { font-size: 0.88rem; color: var(--tenue); margin-top: 12px; text-align: left; }
        .fatto .ric-mail { margin-top: 16px; }
        .colleghi { margin-top: 22px; border-top: 1px solid var(--bordo); padding-top: 18px; }
        .colleghi h2 { font-size: 1.05rem; color: var(--navy-dark); }
        .colleghi .spiega { font-size: 0.88rem; color: var(--tenue); margin-top: 4px; }
        .colleghi ul { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .colleghi li { border: 1px solid var(--bordo); border-left: 3px solid var(--navy-light); border-radius: 6px; padding: 10px 14px; background: var(--chiaro); }
        .col-chi { font-weight: bold; color: var(--navy-dark); }
        .col-ruolo { color: var(--tenue); font-size: 0.85rem; }
        .col-tavoli { font-size: 0.9rem; margin-top: 3px; }
        .col-tavoli.vuoto { color: var(--tenue); font-style: italic; }
        .scelti-elenco { margin: 10px 0 0; padding-left: 20px; text-align: left; display: inline-block; }
        .rifai { font: inherit; font-size: 0.95rem; color: var(--navy); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 14px; }
        .avviso-mail { color: var(--rosso); }
        /* --- la scelta dell'orario (invito a slot) --- */
        .area { margin-top: 18px; border: 1px solid var(--bordo); border-radius: 8px; padding: 14px 16px; background: #fff; }
        .area + .area { margin-top: 12px; }
        .area h2 { font-size: 1.05rem; color: var(--navy-dark); }
        .area-con { font-size: 0.9rem; color: var(--tenue); margin-top: 3px; }
        .area-con b { color: var(--testo); }
        .area-nota { font-size: 0.88rem; color: var(--tenue); margin-top: 3px; font-style: italic; }
        .griglia { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
        .slot { font: inherit; font-size: 0.95rem; color: var(--testo); background: #fff; border: 1px solid var(--bordo); border-radius: 8px; padding: 9px 4px; cursor: pointer; text-align: center; line-height: 1.25; }
        .slot:hover:not(:disabled) { border-color: var(--navy-light); background: var(--chiaro); }
        .slot .et { display: block; font-size: 0.72rem; color: var(--tenue); margin-top: 2px; }
        .slot.scelto { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: bold; }
        .slot.scelto .et { color: #C8DAEA; }
        .slot.mio { border-color: var(--verde); background: #EAF6F0; color: var(--verde); font-weight: bold; }
        .slot.mio .et { color: var(--verde); }
        .slot[disabled]:not(.mio) { cursor: default; background: var(--sfondo); border-style: dashed; color: #94A3B8; }
        /* --- IL MODULO DELL'AZIENDA, compatto ---
           Otto tavoli per quattordici orari erano centododici caselle una
           sotto l'altra: la pagina scorreva per tre schermate e la domanda
           vera ("quale argomento?") si perdeva. I tavoli diventano quindi
           righe che si aprono, una alla volta, e gli orari stanno stretti.
           Si apre da se' quello dove l'azienda ha gia' il suo incontro. */
        .tav { border: 1px solid var(--bordo); border-radius: 8px; background: #fff; margin-top: 8px; }
        .tav[open] { border-color: var(--navy-light); }
        .tav > summary {
            list-style: none; cursor: pointer; padding: 11px 14px;
            display: flex; align-items: baseline; gap: 10px;
        }
        .tav > summary::-webkit-details-marker { display: none; }
        .tav > summary::after { content: '\25BE'; margin-left: auto; color: var(--tenue); font-size: 0.8rem; }
        .tav[open] > summary::after { content: '\25B4'; }
        .tav > summary:hover { background: var(--chiaro); border-radius: 8px; }
        .tav-nome { font-weight: bold; color: var(--navy-dark); font-size: 0.98rem; }
        .tav-quanti { font-size: 0.82rem; color: var(--tenue); }
        .tav-quanti.pieno { color: #8a4a12; }
        .tav-mio { font-size: 0.82rem; color: var(--verde); font-weight: bold; }
        .tav-dentro { padding: 0 14px 12px; }
        .tav-nota { font-size: 0.85rem; color: var(--tenue); font-style: italic; margin-bottom: 8px; }
        .griglia-fitta { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
        .griglia-fitta .slot { padding: 7px 2px; font-size: 0.9rem; border-radius: 6px; }
        .doppio { display: block; font-size: 0.66rem; color: var(--tenue); }
        .slot.scelto .doppio { color: #C8DAEA; }
        .riga-due { display: flex; flex-wrap: wrap; gap: 10px; }
        /* min-width: 0 serve davvero: senza, la larghezza minima di una
           colonna e' quella del suo contenuto - e una tendina con dentro
           "Nessuna preferenza" e' larga - quindi le due colonne non ci
           stanno mai accanto e vanno a capo su qualunque schermo. */
        .riga-due > * { flex: 1 1 240px; min-width: 0; }
        .riga-due select { min-width: 0; }
        .regole.fitte { padding: 11px 14px; font-size: 0.88rem; margin-top: 12px; }
        .regole.fitte ul { margin: 6px 0 0 16px; }
        .regole.fitte li { margin-bottom: 3px; }
        .confermato { border: 1px solid #b7dfc9; border-left: 3px solid var(--verde); background: #EAF6F0; border-radius: 6px; padding: 12px 16px; margin-top: 16px; font-size: 0.95rem; }
        .confermato b { color: var(--verde); }
        .esaurito { border: 1px solid #f3d4b5; border-left: 3px solid #c46a1e; background: #fdeedd; border-radius: 6px; padding: 12px 16px; margin-top: 16px; font-size: 0.93rem; }
        .esaurito b { color: #8a4a12; }
        .legenda { margin-top: 10px; font-size: 0.82rem; color: var(--tenue); }
        .piede { max-width: 680px; margin: 0 auto; padding: 0 20px 40px; text-align: center; font-size: 0.8rem; color: #94A3B8; }
        .piede a { color: var(--tenue); }
    </style>

         in produzione non carica e non esegue nulla. Vedi assets/dev-reload.js -->
    <script>try{var d=/[?&]dev=([01])/.exec(location.search);if(d){d[1]==='1'?sessionStorage.setItem('ngbDevReload','1'):sessionStorage.removeItem('ngbDevReload');}if(sessionStorage.getItem('ngbDevReload')==='1'){var s=document.createElement('script');s.src='/assets/dev-reload.js';s.defer=true;document.head.appendChild(s);}}catch(e){}</script>

<body>
    <header class="testata">
        <div class="testata-dentro">
            <a href="https://nextgenerationbusiness.it"><img src="/assets/logo-revilaw-bianco.png" alt="Revilaw - Revisione legale"></a>
            <h1 id="titolo-pagina">Il Suo incontro B2B</h1>
            <p id="sotto-titolo">Next Generation Business</p>
        </div>
    </header>
    <main>
        <div class="scheda" id="contenuto">
            <div class="avviso" id="caricamento">Un momento: recupero la Sua iscrizione&hellip;</div>
        </div>
    </main>
    <footer class="piede">
        <p>Revilaw S.p.A. &middot; Via XX Settembre 9 - 37129 Verona &middot; C.F. 04641610235</p>
        <p><a href="https://www.iubenda.com/privacy-policy/40996386" target="_blank" rel="noopener">Informativa privacy</a>
            &nbsp;&middot;&nbsp; <a href="https://nextgenerationbusiness.it">nextgenerationbusiness.it</a></p>
    </footer>
    <script>
        (function () {
            'use strict';
            /* Stessa funzione dei form del sito (iscrizione-nuova), azioni b2b-*.
               Il collegamento personale (d = scheda, t = firma) arriva dalla mail
               di invito: senza firma valida il servizio non risponde nulla.
               Qui non si raccolgono interessi: si PRENOTA. Ogni argomento e' un
               tavolo, e chi apre la pagina sceglie a quali sedersi. Siccome
               l'invito parte a tutti i referenti dell'azienda, la pagina mostra
               anche cosa hanno scelto i colleghi: e' l'unico modo perche' due
               persone della stessa impresa non finiscano allo stesso tavolo
               lasciandone scoperto un altro. */
            var API = 'https://revilaw-email.vercel.app/api/iscrizione-nuova';
            var q = new URLSearchParams(location.search);
            var d = q.get('d') || '', t = q.get('t') || '';
            /* Il collegamento dell'AZIENDA: ?a=<azienda>&e=<evento>&t=<firma>.
               E' lo stesso per tutti i referenti dell'impresa - la mail lo dice -
               e apre le scelte dell'azienda, non quelle di chi lo ha in mano. */
            var a = q.get('a') || '', ev = q.get('e') || '';
            var box = document.getElementById('contenuto');
            /* Le descrizioni dei tavoli, NELLO STESSO ORDINE di TEMI_B2B nel
               servizio: al salvataggio viaggiano solo gli indici. Sono gli
               argomenti del convegno. */
            var TEMI = [
                'miglioramento del merito creditizio e accesso ai finanziamenti',
                'adeguati assetti organizzativi, amministrativi e contabili',
                'sostenibilità ed ESG',
                'Modello 231 e Tax Control Framework: un solo sistema di presidio dei rischi penali e fiscali',
                /* il secondo tavolo dello stesso argomento: stessa descrizione,
                   perche' per chi la legge e' lo stesso incontro */
                'Modello 231 e Tax Control Framework: un solo sistema di presidio dei rischi penali e fiscali',
                'finanza agevolata e sostegno agli investimenti',
                'revisione legale dei conti e collegio sindacale',
                'certificazioni ISO e sistemi di gestione: qualità, ambiente e sicurezza',
                'rating di legalità: requisiti, benefici e premialità nei bandi e nel dialogo con le banche',
                'rating di legalità: requisiti, benefici e premialità nei bandi e nel dialogo con le banche',
                /* il desk Revilaw e i suoi due tavoli sono INTERNI: stanno in
                   elenco solo perche' i tre elenchi dei tavoli devono restare
                   identici, ma nel modulo non compaiono mai - li toglie il
                   servizio, che sa quali sono interni */
                'il desk della segreteria: un tavolo riservato, a cui si accede su indicazione dello staff',
                'il desk della segreteria: un tavolo riservato, a cui si accede su indicazione dello staff'
            ];
            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }
            function errore(msg) {
                box.innerHTML = '<div class="avviso errore">' + esc(msg) + '</div>';
            }
            function chiama(corpo) {
                return fetch(API, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.assign({ d: d, a: a, e: ev, t: t }, corpo))
                }).then(function (r) { return r.json().catch(function () { return {}; }); });
            }
            function nomeEvento(pagina) {
                var p = String(pagina || '').split(' - ')[0].trim();
                return p || 'Next Generation Business';
            }
            /* Le etichette corte dei tavoli (quelle che finiscono in tabella)
               arrivano dal servizio: si usano per i colleghi, dove serve una
               riga sola e non la descrizione per esteso. */
            function etichette(r, indici) {
                var corte = r.temi || [];
                var orari = r.orari || [];
                return (indici || []).map(function (i) {
                    var nome = corte[i] || TEMI[i] || '';
                    var ora = String(orari[i] || '').trim();
                    return nome ? (ora ? nome + ' (' + ora + ')' : nome) : '';
                }).filter(Boolean);
            }
            /* Chi altro dell'azienda ha gia' prenotato, e a quali tavoli. Chi non
               ha ancora risposto compare lo stesso: sapere che un collega non si
               e' ancora prenotato vale quanto sapere dove si e' seduto. I temi
               spuntati da lui al momento dell'iscrizione si dicono a parte e con
               parole diverse: sono preferenze, non un posto prenotato. */
            function colleghiHtml(r) {
                var lista = r.colleghi || [];
                /* Nessun collega non vuol dire "non lo so": vuol dire che di
                   quell'azienda e' iscritto solo lui. Dirlo evita la domanda -
                   perche' non vedo nessuno? - che il silenzio lascia aperta. */
                if (!lista.length) {
                    if (!r.azienda) return '';
                    return '<div class="colleghi"><h2>Gli incontri dei Suoi colleghi</h2>'
                        + '<p class="spiega">Al momento e l\'unico referente di <b>' + esc(r.azienda)
                        + '</b> iscritto al convegno: appena se ne iscrive un altro, qui compaiono le sue scelte.</p></div>';
                }
                var voci = lista.map(function (c) {
                    var tavoli = etichette(r, c.temi);
                    var pref = etichette(r, c.preferenze);
                    var riga = tavoli.length
                        ? tavoli.map(esc).join(' &middot; ')
                        : (pref.length
                            ? 'Non ha ancora prenotato &middot; iscrivendosi aveva indicato: ' + pref.map(esc).join(', ')
                            : 'Non ha ancora scelto i suoi incontri');
                    return '<li><span class="col-chi">' + esc(c.nome) + '</span>'
                        + (c.ruolo ? ' <span class="col-ruolo">' + esc(c.ruolo) + '</span>' : '')
                        + '<div class="col-tavoli' + (tavoli.length ? '' : ' vuoto') + '">' + riga + '</div></li>';
                }).join('');
                return '<div class="colleghi"><h2>Gli incontri dei Suoi colleghi</h2>'
                    + '<p class="spiega">Gli altri referenti'
                    + (r.azienda ? ' di <b>' + esc(r.azienda) + '</b>' : ' della Sua azienda')
                    + ' iscritti al convegno. Vedete tutti le stesse scelte, cosi puo decidere se affiancarli o coprire un altro tavolo.</p>'
                    + '<ul>' + voci + '</ul></div>';
            }
            /* Gli argomenti in programma a QUESTO evento: quelli per cui l'invito
               ha indicato un orario. Un tavolo senza orario non si tiene, e
               proporlo vorrebbe dire far prenotare un incontro che non esiste.
               Se non arriva nessun orario (inviti vecchi) si mostrano tutti,
               senza orario, com'era prima che li chiedessimo. */
            function inProgramma(r) {
                var orari = r.orari || [];
                var conOrario = TEMI.map(function (t, i) { return i; })
                    .filter(function (i) { return String(orari[i] || '').trim(); });
                return conOrario.length ? conOrario : TEMI.map(function (t, i) { return i; });
            }
            /* Un tavolo che avevo prenotato e che NON e' piu' in programma: il
               programma puo' cambiare fra un invito e l'altro, e la casella
               sparisce dall'elenco. Se sparisse in silenzio, chi aveva prenotato
               proprio quello si presenterebbe a un incontro che non si tiene, o
               crederebbe di essere ancora prenotato. Quindi si dice. */
            function fuoriProgrammaHtml(r, indici) {
                if (!r.prenotato) return '';
                var persi = (r.scelti || []).filter(function (i) { return indici.indexOf(i) < 0; });
                if (!persi.length) return '';
                var corte = r.temi || [];
                var nomi = persi.map(function (i) { return esc(corte[i] || TEMI[i] || ''); }).join(', ');
                return '<div class="fuori-programma"><b>'

            var sceltaArea = '', sceltaOra = '';

                var aree = r.aree || [];
                if (!aree.length) {
                    errore('Il Vostro invito non risulta collegato a nessun tavolo attivo. Scriva a info@nextgenerationbusiness.it e sistemiamo noi.');
                    return;
                }
                var referenti = r.referenti || [];
                sceltaArea = r.prima ? r.prima.area : '';
                sceltaOra = r.prima ? r.prima.ora : '';
                var altri = referenti.map(function (x) { return x.nome; }).filter(Boolean);
                var colleghi = altri.length > 1
                    ? '<div class="area-con" style="margin-top:6px;">L\'invito &egrave; arrivato anche a <b>' + esc(altri.join(', '))
                    + '</b>: &egrave; un invito solo per l\'azienda, e questo collegamento &egrave; lo stesso per tutti voi. '
                    + 'Le scelte qui sotto valgono per l\'impresa, chiunque le salvi.</div>'
                    : '';
                /* LE REGOLE PRIMA DELLE GRIGLIE: chi compila deve sapere cosa
                   sta facendo prima di premere, non dopo. Sono le stesse frasi
                   della mail d'invito, scritte una volta sola nel servizio. */
                var regole = (r.regole || []).length
                    ? '<div class="regole fitte"><b>Come funziona</b><ul>'
                    + r.regole.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('')
                    + '</ul></div>'
                    : '';
                var prima = r.prima
                    ? '<div class="confermato"><b>Prima preferenza prenotata:</b> ' + esc(r.prima.areaNome)
                    + ', <b>' + esc(r.prima.ora) + (r.prima.fine ? ' - ' + esc(r.prima.fine) : '') + '</b>'
                    + (r.prima.perChi ? ' - per <b>' + esc(r.prima.perChi) + '</b>' : '')
                    + '. Per cambiarla scelga un altro orario qui sotto: la prenotazione si sposta.</div>'
                    : '';
                var assegnati = (r.assegnati || []).length
                    ? '<div class="confermato"><b>Assegnati da noi:</b> '
                    + r.assegnati.map(function (x) {
                        return esc(x.areaNome) + ' ' + esc(x.ora) + (x.perChi ? ' (per ' + esc(x.perChi) + ')' : '');
                    }).join('; ') + '. Per spostarli ci scriva.</div>'
                    : '';
                var esaurito = (r.esaurito && !r.prima)
                    ? '<div class="esaurito"><b>Gli orari disponibili sono esauriti.</b> '
                    + 'Pu&ograve; indicare lo stesso le Sue preferenze qui sotto: se si libera un posto La chiamiamo noi.</div>'
                    : '';
                var vocePref = function (pos) {
                    var c = (r.coda || []).filter(function (x) { return x.pos === pos; })[0] || null;
                    var et = pos === 2 ? 'Seconda preferenza' : 'Terza preferenza';
                    if (c && c.stato === 'assegnata') {
                        return '<div class="pref bloccata" style="margin-top:0;"><div class="pref-et">' + et + '</div>'
                            + '<div>' + esc(c.areaNome) + (c.ora ? ' - <b>' + esc(c.ora) + '</b>' : '')
                            + (c.perChi ? ' - per ' + esc(c.perChi) : '')
                            + '<div class="mini">Questo incontro &egrave; gi&agrave; fissato: per spostarlo ci scriva.</div></div></div>';
                    }
                    return '<div class="pref" style="margin-top:0;"><div class="pref-et">' + et + '</div>'
                        + '<div class="pref-righe">'
                        + tendinaTavolo('area' + pos, c ? c.area : '', aree)
                        + tendinaChi('chi' + pos, c ? c.perDoc : '', referenti)
                        + '</div></div>';
                };
                var esigenze = (r.esigenze || []);
                var righeEsigenze = function () {
                    var righe = esigenze.length ? esigenze : [{ perDoc: '', testo: '' }];
                    return righe.map(function (e, i) {
                        return '<div class="esigenza">'
                            + tendinaChi('esigenzaChi' + i, e.perDoc || '', referenti)
                            + '<textarea class="esigenza-testo" maxlength="600" '
                            + 'placeholder="Un\'altra questione che vorreste approfondire">' + esc(e.testo || '') + '</textarea>'
                            + '</div>';
                    }).join('');
                };
                /* L'ORDINE DEL MODULO, e sono tre passi e non dieci:
                   1. chi partecipa e a quale tavolo/ora (la prima preferenza,
                      l'unica che prenota davvero);
                   2. le altre due preferenze, una accanto all'altra;
                   3. l'altra questione, se ce n'e' una.
                   Tutto il resto - saluto, regole, incontri gia' fissati -
                   sta sopra, in righe corte: si legge una volta e non
                   ritorna. */
                box.innerHTML =
                    '<div class="riepilogo">Gentile <b>' + esc((r.azienda || {}).nome || 'azienda') + '</b>, '
                    + 'la invitiamo agli incontri B2B riservati'
                    + (ev.quando ? ' del ' + esc(ev.quando) : '')
                    + (ev.luogo ? ' - ' + esc(ev.luogo) : '') + '.'
                    + colleghi + '</div>'
                    + regole + prima + assegnati + esaurito
                    + '<div class="pref-et grande">1. Prima preferenza: tavolo e orario</div>'
                    + '<div class="mini" style="margin:2px 0 8px;">Apra il tavolo che Vi interessa e prema un orario. '
                    + '&Egrave; l\'unica scelta che prenota davvero.</div>'
                    + '<div class="pref-righe" style="margin-bottom:8px;">' + tendinaChi('chi1', r.prima ? r.prima.perDoc : '', referenti) + '</div>'
                    + aree.map(htmlAreaAz).join('')
                    + '<div class="pref-et grande">2. Seconda e terza preferenza</div>'
                    + '<div class="mini" style="margin:2px 0 6px;">Solo il tavolo: l\'orario glielo assegniamo noi se restano posti.</div>'
                    + '<div class="riga-due">' + vocePref(2) + vocePref(3) + '</div>'
                    + '<div class="pref-et grande">3. Un\'altra questione (facoltativo)</div>'
                    + '<div class="mini" style="margin:2px 0 6px;">Le preferenze restano tre: questa &egrave; una domanda in pi&ugrave;, non un quarto incontro.</div>'
                    + '<div id="esigenze">' + righeEsigenze() + '</div>'
                    + '<div class="azioni"><button type="button" class="invia" id="salva-az">Salvo le nostre scelte</button>'
                    + '<div class="esito" id="esito"></div></div>';
                box.querySelectorAll('.slot').forEach(function (b) {
                    b.addEventListener('click', function () {
                        sceltaArea = b.dataset.area; sceltaOra = b.dataset.ora;
                        box.querySelectorAll('.slot').forEach(function (x) { x.classList.remove('scelto'); });
                        b.classList.add('scelto');
                        var e = document.getElementById('esito');
                        if (e) { e.className = 'esito'; e.textContent = ''; }
                    });
                });
                document.getElementById('salva-az').addEventListener('click', salvaAzienda);
            }
            function valore(campo) {
                var el = box.querySelector('[data-campo="' + campo + '"]');
                return el ? el.value : '';
            }
            function salvaAzienda() {
                var esito = document.getElementById('esito');
                var chi1 = valore('chi1');
                if (sceltaOra && !chi1) {
                    esito.className = 'esito ko';
                    esito.textContent = 'Indichi chi partecipa al primo incontro: e il nome che scriviamo sul foglio del desk.';
                    return;
                }
                var coda = [];
                [2, 3].forEach(function (pos) {
                    var area = valore('area' + pos), chi = valore('chi' + pos);
                    if (area && chi) coda.push({ pos: pos, area: area, perDoc: chi });
                });
                var esigenze = [];
                box.querySelectorAll('.esigenza').forEach(function (riga) {
                    var chi = riga.querySelector('.chi');
                    var testo = riga.querySelector('.esigenza-testo');
                    if (chi && testo && chi.value && testo.value.trim()) {
                        esigenze.push({ perDoc: chi.value, testo: testo.value.trim() });
                    }
                });
                var mancanti = [];
                [2, 3].forEach(function (pos) {
                    var area = valore('area' + pos), chi = valore('chi' + pos);
                    if (area && !chi) mancanti.push(pos === 2 ? 'seconda' : 'terza');
                });
                box.querySelectorAll('.esigenza').forEach(function (riga) {
                    var chi = riga.querySelector('.chi');
                    var testo = riga.querySelector('.esigenza-testo');
                    if (testo && testo.value.trim() && chi && !chi.value) mancanti.push('esigenza');
                });
                if (mancanti.length) {
                    esito.className = 'esito ko';
                    esito.textContent = 'Manca il nominativo: ogni preferenza e ogni esigenza deve dire chi se ne occupa.';
                    return;
                }
                var b = document.getElementById('salva-az');
                var etichetta = b.textContent;
                inCorso = true;
                b.disabled = true; b.textContent = 'Salvataggio in corso…';
                esito.className = 'esito'; esito.textContent = '';
                chiama({
                    azione: 'b2b-azienda-salva', rev: azRev,
                    prima: sceltaOra ? { area: sceltaArea, ora: sceltaOra, perDoc: chi1 } : null,
                    coda: coda, esigenze: esigenze
                }).then(function (e) {
                    inCorso = false;
                    if (!e || !e.ok) {
                        b.disabled = false; b.textContent = etichetta;
                        esito.className = 'esito ko';
                        esito.textContent = (e && e.msg) || 'Salvataggio non riuscito: riprovi fra un momento.';
                        // un collega ha salvato prima, oppure l'orario e' appena
                        // stato preso: si rilegge, invece di lasciare a video una
                        // pagina che racconta una cosa che non c'e' piu'
                        if (e && (e.motivo === 'collega' || e.motivo === 'occupato' || e.motivo === 'orario')) {
                            setTimeout(apri, 1500);
                        }
                        return;
                    }
                    fattoAzienda(e);
                }).catch(function () {
                    inCorso = false;
                    b.disabled = false; b.textContent = etichetta;
                    esito.className = 'esito ko';
                    esito.textContent = 'Servizio non raggiungibile: riprovi fra un momento.';
                });
            }
            /* Il nome della preferenza per esteso. Nel modulo si sceglie
               "prima, seconda, terza" e nella ricevuta si leggeva "(2a)"
               appiccicato al nome del tavolo: la stessa cosa detta in due
               modi, e il secondo va decifrato. */
            function nomePosizione(pos) {
                return pos === 3 ? 'Terza preferenza' : (pos === 2 ? 'Seconda preferenza' : 'Prima preferenza');
            }
            /* Una riga della ricevuta: il tavolo a sinistra, a destra l'ora
               (se c'e') o la posizione della preferenza, e sotto, in piccolo,
               chi ci va e da dove viene quell'orario. Sempre la stessa forma,
               prenotato o in attesa: sono le due colonne a dire quale delle
               due cose sia.
               Il nome del tavolo resta SOLO il nome del tavolo: appendergli
               "- seconda preferenza" lo faceva sembrare il nome di un altro
               tavolo, e quella e' una nota, non un titolo. */
            function rigaRicevuta(tavolo, destra, chi, forte, sotto) {
                var piccolo = [chi ? 'per ' + chi : '', sotto || ''].filter(Boolean).join(' \u00b7 ');
                return '<li><div class="ric-testa"><span class="ric-tavolo">' + esc(tavolo) + '</span>'
                    + (destra ? '<span class="' + (forte ? 'ric-ora' : 'ric-pos') + '">' + esc(destra) + '</span>' : '')
                    + '</div>'
                    + (piccolo ? '<div class="ric-chi">' + esc(piccolo) + '</div>' : '') + '</li>';
            }
            function fattoAzienda(e) {
                var righe = [];
                if (e.prima) {
                    righe.push(rigaRicevuta(e.prima.areaNome,
                        e.prima.ora + (e.prima.fine ? ' - ' + e.prima.fine : ''), e.prima.perChi, true,
                        'prima preferenza, orario scelto da Voi'));
                }
                /* Gli incontri che abbiamo assegnato NOI a una seconda o terza
                   preferenza: sono prenotati come il primo - al desk valgono
                   uguale - ma dire da dove vengono evita la telefonata di chi
                   non ricorda di aver scelto quell'orario, perche' non l'ha
                   scelto. */
                (e.assegnati || []).forEach(function (x) {
                    righe.push(rigaRicevuta(x.areaNome, x.ora + (x.fine ? ' - ' + x.fine : ''), x.perChi, true,
                        nomePosizione(Number(x.scelta) || 2).toLowerCase() + ', orario assegnato da noi'));
                });
                var attesa = (e.coda || []).filter(function (x) { return x.stato !== 'assegnata'; })
                    .sort(function (a, b) { return (Number(a.pos) || 2) - (Number(b.pos) || 2); });
                var bloccate = (e.bloccate || []).length
                    ? '<p style="margin-top:10px;" class="avviso-mail">La '
                    + e.bloccate.map(function (p) { return p === 3 ? 'terza' : 'seconda'; }).join(' e la ')
                    + ' preferenza &egrave; gi&agrave; stata fissata da noi con un orario: quella non si cambia da qui, ci scriva.</p>'
                    : '';
                var esitoPrima = (e.esitoPrima && !e.esitoPrima.ok && !e.esitoPrima.liberata)
                    ? '<p style="margin-top:10px;" class="avviso-mail">L\'orario della prima preferenza non era piu&grave; libero: '
                    + esc(e.esitoPrima.msg || 'ne scelga un altro') + '</p>'
                    : '';
                box.innerHTML = '<div class="fatto"><div class="segno">&#10003;</div><h2>Scelte salvate</h2>'
                    + '<div class="ricevuta">'
                    + (righe.length
                        ? '<div class="ric-blocco"><div class="ric-et">'
                        + (righe.length === 1 ? 'Incontro prenotato' : 'Incontri prenotati')
                        + '</div><ul class="ric-lista">' + righe.join('') + '</ul>'
                        + '<p class="ric-nota">' + (righe.length === 1
                            ? 'Ha un orario: al desk risulta gi&agrave; a nome Vostro.'
                            : 'Hanno un orario: al desk risultano gi&agrave; a nome Vostro.') + '</p></div>'
                        : '<div class="ric-blocco attesa"><div class="ric-et">Nessun orario</div>'
                        + '<p class="ric-nota">Non risulta ancora nessun incontro prenotato per la Vostra azienda.</p></div>')
                    /* LE PREFERENZE SENZA ORARIO, e che cosa ne sara'.
                       "In attesa di un orario" da solo non dice se qualcosa
                       accadra' o no, e chi legge resta con la domanda aperta:
                       qui si dice la regola per intero - se al tavolo restano
                       posti l'orario lo assegniamo noi e arriva una mail - e
                       subito dopo che cosa vale oggi, cioe' niente. */
                    + (attesa.length
                        ? '<div class="ric-blocco attesa"><div class="ric-et">In attesa di un orario</div>'
                        + '<ul class="ric-lista">'
                        + attesa.map(function (x) {
                            return rigaRicevuta(x.areaNome, nomePosizione(Number(x.pos) || 2), x.perChi, false);
                        }).join('')
                        + '</ul>'
                        + '<p class="ric-nota"><b>Se al tavolo resteranno posti liberi, l\'orario glielo assegniamo noi</b> '
                        + 'e Le arriva una mail con il foglio aggiornato. Finch&eacute; quella mail non arriva non sono '
                        + 'prenotazioni: al desk non risulta nessun incontro a quei tavoli.</p></div>'
                        : '')
                    + '</div>'
                    + bloccate + esitoPrima
                    + (e.mailInviata
                        ? '<p class="ric-mail">Abbiamo mandato la conferma'
                        + ((e.avvisati || []).length > 1 ? ' a tutti i referenti' : '')
                        + ', con il <b>foglio da presentare al desk</b> in allegato.</p>'
                        : '<p class="ric-mail avviso-mail">Le scelte sono salvate, ma la mail di conferma non &egrave; partita. '
                        + 'Riprovi fra qualche minuto, oppure scriva a info@nextgenerationbusiness.it: al desk basta il nome dell\'azienda.</p>')
                    + '<button type="button" class="rifai" id="rifai">Rivedi le scelte o rimanda la mail</button></div>';
                document.getElementById('rifai').addEventListener('click', apri);
            }

            function apri() {
                lettoIl = Date.now();
                box.innerHTML = '<div class="avviso">Un momento: recupero la Sua iscrizione&hellip;</div>';
                chiama({ azione: a ? 'b2b-azienda-leggi' : 'b2b-leggi' }).then(function (r) {
                    if (!r || !r.ok) { errore((r && r.msg) || 'Collegamento non valido o scaduto. Scriva a info@nextgenerationbusiness.it e provvediamo noi.'); return; }
                    /* Due inviti, due pagine. Chi e' stato convocato a un tavolo
                       con la sua agenda sceglie l'ORARIO; chi ha ricevuto
                       l'invito di prima continua a vedere i tavoli a caselle,
                       come dice la mail che ha in casella. Lo decide il
                       servizio, che sa com'e' partito quell'invito. */
                    if (r.modo === 'azienda') { moduloAzienda(r); return; }
                    if (r.modo === 'slot') { moduloSlot(r); return; }
                    modulo(r);
                }).catch(function () {
                    errore('Servizio non raggiungibile in questo momento: riprovi fra qualche minuto.');
                });
            }
            if (!t || (!d && !(a && ev))) {
                errore('Questa pagina si apre dal collegamento che trova nella mail di invito. Se non lo trova, scriva a info@nextgenerationbusiness.it');
                return;
            }
            /* LA PAGINA SI RILEGGE QUANDO SI TORNA A GUARDARLA. Le prenotazioni
               le tocchiamo anche noi: uno spostamento, un orario liberato,
               un'esigenza portata a un tavolo. Chi ha lasciato la pagina aperta
               ieri si ritroverebbe davanti un'agenda che non esiste piu', e
               premendo Salva si sentirebbe dire che un collega ha cambiato
               tutto. Si rilegge solo se e' passato qualche minuto e se non si
               sta salvando: rileggere sotto le dita di chi sta compilando
               cancellerebbe quello che ha appena scritto. */
            var lettoIl = 0;
            var inCorso = false;
            document.addEventListener('visibilitychange', function () {
                if (document.hidden || inCorso) return;
                if (Date.now() - lettoIl < 120000) return;
                if (!document.getElementById('salva-az')) return;   // non siamo nel modulo dell'azienda
                apri();
            });
            apri();
        })();
    </script>
</body>
</html>
