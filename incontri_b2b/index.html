<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Pagina di servizio raggiunta SOLO dal collegamento personale nella mail
         di invito agli incontri B2B: non va indicizzata e non e' nella sitemap. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Il Suo incontro B2B | Next Generation Business</title>
    <style>
        :root {
            --navy-dark: #0A2844; --navy: #164068; --navy-light: #2A5A85;
            --testo: #1E293B; --tenue: #475569; --bordo: #E2E8F0;
            --sfondo: #F1F5F9; --chiaro: #F4F8FB; --rosso: #B3261E; --verde: #1E7F4F;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background: var(--sfondo); color: var(--testo); line-height: 1.6; }
        .testata { background: var(--navy-dark); padding: 26px 20px; }
        .testata-dentro { max-width: 680px; margin: 0 auto; }
        .testata img { display: block; width: 140px; height: auto; }
        .testata h1 { color: #fff; font-size: 1.6rem; letter-spacing: -0.3px; margin-top: 18px; }
        .testata p { color: #C8DAEA; font-size: 1rem; margin-top: 6px; }
        main { max-width: 680px; margin: 0 auto; padding: 24px 20px 60px; }
        .scheda { background: #fff; border: 1px solid var(--bordo); border-radius: 10px; padding: 22px; margin-top: 18px; }
        .avviso { text-align: center; color: var(--tenue); padding: 30px 10px; }
        .avviso.errore { color: var(--rosso); }
        .riepilogo { background: var(--chiaro); border: 1px solid var(--bordo); border-left: 3px solid var(--navy-light); border-radius: 6px; padding: 12px 16px; font-size: 0.95rem; }
        .temi { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
        .tema { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--bordo); border-radius: 8px; padding: 11px 14px; cursor: pointer; background: #fff; }
        .tema:hover { border-color: var(--navy-light); background: var(--chiaro); }
        .tema input { width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; }
        .tema span { font-size: 0.98rem; }
        .tema-ora { display: block; margin-top: 2px; font-size: 0.88rem; font-weight: bold; color: var(--navy-light); }
        .campo { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; }
        .campo label { font-size: 0.85rem; font-weight: bold; color: var(--tenue); }
        .campo textarea { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--bordo); border-radius: 6px; width: 100%; min-height: 110px; resize: vertical; color: var(--testo); }
        .campo textarea:focus { outline: 2px solid var(--navy-light); outline-offset: 1px; }
        .azioni { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .invia { font: inherit; font-size: 1.05rem; font-weight: bold; letter-spacing: 0.3px; color: #fff; background: var(--navy); border: none; border-radius: 6px; padding: 14px 34px; cursor: pointer; }
        .invia:hover { background: var(--navy-dark); }
        .invia[disabled] { opacity: 0.6; cursor: default; }
        .esito { min-height: 22px; font-size: 0.92rem; text-align: center; }
        .esito.ko { color: var(--rosso); font-weight: bold; }
        .fatto { text-align: center; padding: 26px 10px; }
        .fatto .segno { font-size: 2.4rem; color: var(--verde); }
        .fuori-programma { margin-top: 14px; border: 1px solid #f3d4b5; border-left: 3px solid #c46a1e; background: #fdeedd; border-radius: 6px; padding: 12px 16px; font-size: 0.93rem; }
        .fuori-programma b { color: #8a4a12; }
        .fatto h2 { color: var(--navy-dark); margin: 8px 0 6px; }
        .fatto p { color: var(--tenue); }
        .colleghi { margin-top: 22px; border-top: 1px solid var(--bordo); padding-top: 18px; }
        .colleghi h2 { font-size: 1.05rem; color: var(--navy-dark); }
        .colleghi .spiega { font-size: 0.88rem; color: var(--tenue); margin-top: 4px; }
        .colleghi ul { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .colleghi li { border: 1px solid var(--bordo); border-left: 3px solid var(--navy-light); border-radius: 6px; padding: 10px 14px; background: var(--chiaro); }
        .col-chi { font-weight: bold; color: var(--navy-dark); }
        .col-ruolo { color: var(--tenue); font-size: 0.85rem; }
        .col-tavoli { font-size: 0.9rem; margin-top: 3px; }
        .col-tavoli.vuoto { color: var(--tenue); font-style: italic; }
        .scelti-elenco { margin: 10px 0 0; padding-left: 20px; text-align: left; display: inline-block; }
        .rifai { font: inherit; font-size: 0.95rem; color: var(--navy); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 14px; }
        .avviso-mail { color: var(--rosso); }
        .piede { max-width: 680px; margin: 0 auto; padding: 0 20px 40px; text-align: center; font-size: 0.8rem; color: #94A3B8; }
        .piede a { color: var(--tenue); }
    </style>
</head>
<body>
    <header class="testata">
        <div class="testata-dentro">
            <a href="https://nextgenerationbusiness.it"><img src="/assets/logo-revilaw-bianco.png" alt="Revilaw - Revisione legale"></a>
            <h1>Il Suo incontro B2B</h1>
            <p id="sotto-titolo">Next Generation Business</p>
        </div>
    </header>
    <main>
        <div class="scheda" id="contenuto">
            <div class="avviso" id="caricamento">Un momento: recupero la Sua iscrizione&hellip;</div>
        </div>
    </main>
    <footer class="piede">
        <p>Revilaw S.p.A. &middot; Via XX Settembre 9 - 37129 Verona &middot; C.F. 04641610235</p>
        <p><a href="https://www.iubenda.com/privacy-policy/40996386" target="_blank" rel="noopener">Informativa privacy</a>
            &nbsp;&middot;&nbsp; <a href="https://nextgenerationbusiness.it">nextgenerationbusiness.it</a></p>
    </footer>
    <script>
        (function () {
            'use strict';
            /* Stessa funzione dei form del sito (iscrizione-nuova), azioni b2b-*.
               Il collegamento personale (d = scheda, t = firma) arriva dalla mail
               di invito: senza firma valida il servizio non risponde nulla.
               Qui non si raccolgono interessi: si PRENOTA. Ogni argomento e' un
               tavolo, e chi apre la pagina sceglie a quali sedersi. Siccome
               l'invito parte a tutti i referenti dell'azienda, la pagina mostra
               anche cosa hanno scelto i colleghi: e' l'unico modo perche' due
               persone della stessa impresa non finiscano allo stesso tavolo
               lasciandone scoperto un altro. */
            var API = 'https://revilaw-email.vercel.app/api/iscrizione-nuova';
            var q = new URLSearchParams(location.search);
            var d = q.get('d') || '', t = q.get('t') || '';
            var box = document.getElementById('contenuto');
            /* Le descrizioni dei tavoli, NELLO STESSO ORDINE di TEMI_B2B nel
               servizio: al salvataggio viaggiano solo gli indici. Sono gli
               argomenti del convegno. */
            var TEMI = [
                'miglioramento del merito creditizio e accesso ai finanziamenti',
                'controllo di gestione e pianificazione finanziaria',
                'adeguati assetti organizzativi, amministrativi e contabili',
                'sostenibilità ed ESG',
                'Modello 231 e rating di legalità',
                'finanza agevolata e sostegno agli investimenti',
                'Tax Control Framework',
                'opportunità connesse allo sviluppo di Bagnoli e all\'America\'s Cup',
                'altre esigenze specifiche della Sua impresa'
            ];
            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }
            function errore(msg) {
                box.innerHTML = '<div class="avviso errore">' + esc(msg) + '</div>';
            }
            function chiama(corpo) {
                return fetch(API, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.assign({ d: d, t: t }, corpo))
                }).then(function (r) { return r.json().catch(function () { return {}; }); });
            }
            function nomeEvento(pagina) {
                var p = String(pagina || '').split(' - ')[0].trim();
                return p || 'Next Generation Business';
            }
            /* Le etichette corte dei tavoli (quelle che finiscono in tabella)
               arrivano dal servizio: si usano per i colleghi, dove serve una
               riga sola e non la descrizione per esteso. */
            function etichette(r, indici) {
                var corte = r.temi || [];
                var orari = r.orari || [];
                return (indici || []).map(function (i) {
                    var nome = corte[i] || TEMI[i] || '';
                    var ora = String(orari[i] || '').trim();
                    return nome ? (ora ? nome + ' (' + ora + ')' : nome) : '';
                }).filter(Boolean);
            }
            /* Chi altro dell'azienda ha gia' prenotato, e a quali tavoli. Chi non
               ha ancora risposto compare lo stesso: sapere che un collega non si
               e' ancora prenotato vale quanto sapere dove si e' seduto. I temi
               spuntati da lui al momento dell'iscrizione si dicono a parte e con
               parole diverse: sono preferenze, non un posto prenotato. */
            function colleghiHtml(r) {
                var lista = r.colleghi || [];
                /* Nessun collega non vuol dire "non lo so": vuol dire che di
                   quell'azienda e' iscritto solo lui. Dirlo evita la domanda -
                   perche' non vedo nessuno? - che il silenzio lascia aperta. */
                if (!lista.length) {
                    if (!r.azienda) return '';
                    return '<div class="colleghi"><h2>Gli incontri dei Suoi colleghi</h2>'
                        + '<p class="spiega">Al momento e l\'unico referente di <b>' + esc(r.azienda)
                        + '</b> iscritto al convegno: appena se ne iscrive un altro, qui compaiono le sue scelte.</p></div>';
                }
                var voci = lista.map(function (c) {
                    var tavoli = etichette(r, c.temi);
                    var pref = etichette(r, c.preferenze);
                    var riga = tavoli.length
                        ? tavoli.map(esc).join(' &middot; ')
                        : (pref.length
                            ? 'Non ha ancora prenotato &middot; iscrivendosi aveva indicato: ' + pref.map(esc).join(', ')
                            : 'Non ha ancora scelto i suoi incontri');
                    return '<li><span class="col-chi">' + esc(c.nome) + '</span>'
                        + (c.ruolo ? ' <span class="col-ruolo">' + esc(c.ruolo) + '</span>' : '')
                        + '<div class="col-tavoli' + (tavoli.length ? '' : ' vuoto') + '">' + riga + '</div></li>';
                }).join('');
                return '<div class="colleghi"><h2>Gli incontri dei Suoi colleghi</h2>'
                    + '<p class="spiega">Gli altri referenti'
                    + (r.azienda ? ' di <b>' + esc(r.azienda) + '</b>' : ' della Sua azienda')
                    + ' iscritti al convegno. Vedete tutti le stesse scelte, cosi puo decidere se affiancarli o coprire un altro tavolo.</p>'
                    + '<ul>' + voci + '</ul></div>';
            }
            /* Gli argomenti in programma a QUESTO evento: quelli per cui l'invito
               ha indicato un orario. Un tavolo senza orario non si tiene, e
               proporlo vorrebbe dire far prenotare un incontro che non esiste.
               Se non arriva nessun orario (inviti vecchi) si mostrano tutti,
               senza orario, com'era prima che li chiedessimo. */
            function inProgramma(r) {
                var orari = r.orari || [];
                var conOrario = TEMI.map(function (t, i) { return i; })
                    .filter(function (i) { return String(orari[i] || '').trim(); });
                return conOrario.length ? conOrario : TEMI.map(function (t, i) { return i; });
            }
            /* Un tavolo che avevo prenotato e che NON e' piu' in programma: il
               programma puo' cambiare fra un invito e l'altro, e la casella
               sparisce dall'elenco. Se sparisse in silenzio, chi aveva prenotato
               proprio quello si presenterebbe a un incontro che non si tiene, o
               crederebbe di essere ancora prenotato. Quindi si dice. */
            function fuoriProgrammaHtml(r, indici) {
                if (!r.prenotato) return '';
                var persi = (r.scelti || []).filter(function (i) { return indici.indexOf(i) < 0; });
                if (!persi.length) return '';
                var corte = r.temi || [];
                var nomi = persi.map(function (i) { return esc(corte[i] || TEMI[i] || ''); }).join(', ');
                return '<div class="fuori-programma"><b>'
                    + (persi.length === 1 ? 'Un incontro che aveva prenotato non e piu in programma'
                        : 'Alcuni incontri che aveva prenotato non sono piu in programma')
                    + ':</b> ' + nomi + '. '
                    + 'Ci dispiace: scelga qui sotto un altro tavolo e confermi, cosi la Sua prenotazione torna valida.</div>';
            }
            function modulo(r) {
                document.getElementById('sotto-titolo').textContent = 'Next Generation Business - ' + nomeEvento(r.pagina);
                var scelti = r.scelti || [];
                var orari = r.orari || [];
                var indici = inProgramma(r);
                var caselle = indici.map(function (i) {
                    var ora = String(orari[i] || '').trim();
                    return '<label class="tema"><input type="checkbox" class="tema-c" value="' + i + '"'
                        + (scelti.indexOf(i) >= 0 ? ' checked' : '') + '><span>' + esc(TEMI[i])
                        + (ora ? '<span class="tema-ora">' + esc(ora) + '</span>' : '') + '</span></label>';
                }).join('');
                box.innerHTML =
                    '<div class="riepilogo">' + (r.nome ? 'Gentile <b>' + esc(r.nome) + '</b>, l' : 'L')
                    + 'a invitiamo agli incontri B2B riservati che si tengono durante la giornata: '
                    + 'un tavolo per argomento, con i professionisti e gli specialisti della materia, '
                    + 'ognuno con il suo orario. Scelga a quale o a quali desidera partecipare, '
                    + 'controllando che gli orari non si sovrappongano.'
                    /* Le caselle possono venire da due posti diversi, e dirlo cambia
                       il senso di quello che si sta guardando: una prenotazione gia
                       fatta, oppure i temi indicati iscrivendosi, che sono solo un
                       punto di partenza e non valgono come prenotazione. */
                    + (r.prenotato && scelti.some(function (i) { return indici.indexOf(i) >= 0; })
                        ? ' Le caselle gia segnate sono la Sua prenotazione: puo confermarla o cambiarla.'
                        : (r.daPreferenze ? ' Abbiamo gia segnato i temi che aveva indicato iscrivendosi: li confermi, o li cambi. '
                            + 'Finche non conferma, per noi non c\'e ancora una prenotazione.' : ''))
                    + '</div>'
                    + fuoriProgrammaHtml(r, indici)
                    + '<div class="temi">' + caselle + '</div>'
                    + '<div class="campo"><label for="nota">Il progetto o l\'esigenza su cui vorrebbe confrontarsi (facoltativo)</label>'
                    + '<textarea id="nota" maxlength="800" placeholder="Qualche riga basta: ci aiuta a scegliere gli interlocutori giusti.">' + esc(r.nota || '') + '</textarea></div>'
                    + '<div class="azioni"><button type="button" class="invia" id="invia">'
                    + (r.prenotato ? 'Confermo la prenotazione' : 'Prenota il mio incontro') + '</button>'
                    + '<div class="esito" id="esito"></div></div>'
                    + colleghiHtml(r);
                document.getElementById('invia').addEventListener('click', function () { invia(r); });
            }
            function invia(r) {
                var esito = document.getElementById('esito');
                var temi = Array.prototype.slice.call(document.querySelectorAll('.tema-c:checked'))
                    .map(function (c) { return parseInt(c.value, 10); });
                var nota = document.getElementById('nota').value.trim();
                if (!temi.length) {
                    esito.className = 'esito ko';
                    esito.textContent = 'Segni almeno un incontro: e la Sua prenotazione.';
                    return;
                }
                var b = document.getElementById('invia');
                var etichettaB = b.textContent;
                b.disabled = true; b.textContent = 'Invio in corso…';
                esito.className = 'esito'; esito.textContent = '';
                chiama({ azione: 'b2b-salva', temi: temi, nota: nota }).then(function (esitoR) {
                    if (!esitoR || !esitoR.ok) {
                        b.disabled = false; b.textContent = etichettaB;
                        esito.className = 'esito ko';
                        esito.textContent = (esitoR && esitoR.msg) || 'Invio non riuscito: riprovi fra un momento.';
                        return;
                    }
                    fatto(r, temi, esitoR.mailInviata !== false);
                }).catch(function () {
                    b.disabled = false; b.textContent = etichettaB;
                    esito.className = 'esito ko';
                    esito.textContent = 'Servizio non raggiungibile: riprovi fra un momento.';
                });
            }
            /* Prenotazione presa: si ripete quali tavoli, perche' la conferma
               di una scelta senza la scelta scritta accanto non conferma niente.
               E si dice che la mail con il foglio per il desk e' partita: e'
               quella la cosa da cercare in casella, e se non e' partita conviene
               saperlo subito invece che la mattina del convegno. */
            function fatto(r, temi, mailInviata) {
                var orari = r.orari || [];
                var elenco = temi.map(function (i) {
                    var ora = String(orari[i] || '').trim();
                    return '<li>' + esc(TEMI[i]) + (ora ? ' <b>' + esc(ora) + '</b>' : '') + '</li>';
                }).join('');
                box.innerHTML = '<div class="fatto"><div class="segno">&#10003;</div>'
                    + '<h2>Prenotazione registrata</h2>'
                    + '<p>La aspettiamo' + (temi.length > 1 ? ' ai tavoli' : ' al tavolo') + ':</p>'
                    + '<ul class="scelti-elenco">' + elenco + '</ul>'
                    + (mailInviata
                        ? '<p style="margin-top:12px;">Le abbiamo mandato una mail di conferma con il <b>foglio da presentare al desk</b> in allegato: '
                        + 'lo porti stampato o sul telefono.</p>'
                        : '<p style="margin-top:12px;" class="avviso-mail">La prenotazione &egrave; registrata, ma la mail di conferma con il foglio per il desk non &egrave; partita. '
                        + 'Riprovi fra qualche minuto con il pulsante qui sotto, oppure scriva a info@nextgenerationbusiness.it: al desk basta il Suo nome.</p>')
                    + '<p style="margin-top:10px;">Le confermeremo gli specialisti che saranno a Sua disposizione a ciascun tavolo.'
                    + '<br>Pu&ograve; cambiare la scelta quando vuole: riceve subito una nuova mail con il foglio aggiornato.</p>'
                    + '<button type="button" class="rifai" id="rifai">Cambia la scelta o rimanda la mail</button></div>';
                document.getElementById('rifai').addEventListener('click', apri);
            }
            function apri() {
                box.innerHTML = '<div class="avviso">Un momento: recupero la Sua iscrizione&hellip;</div>';
                chiama({ azione: 'b2b-leggi' }).then(function (r) {
                    if (!r || !r.ok) { errore((r && r.msg) || 'Collegamento non valido o scaduto. Scriva a info@nextgenerationbusiness.it e provvediamo noi.'); return; }
                    modulo(r);
                }).catch(function () {
                    errore('Servizio non raggiungibile in questo momento: riprovi fra qualche minuto.');
                });
            }
            if (!d || !t) {
                errore('Questa pagina si apre dal collegamento personale che trova nella mail di invito. Se non la trova, scriva a info@nextgenerationbusiness.it');
                return;
            }
            apri();
        })();
    </script>
</body>
</html>
