name: Backup notturno

# Sostituisce l'attivita' pianificata di Windows delle 03:00, ferma da quando
# il PC si e' rotto. Girando qui non dipende piu' da nessun computer.
#
# Segreti richiesti (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT  obbligatorio - chiave del service account Firebase
#   GDRIVE_SERVICE_ACCOUNT    facoltativo  - chiave per scrivere su Drive
#                                            (se manca si riusa quella Firebase)
#   GDRIVE_FOLDER_ID          facoltativo  - id della cartella Backup-NGB
#
# Senza i due facoltativi il backup funziona lo stesso: le copie restano
# allegate all'esecuzione (artifact) invece di finire su Drive.
#
# ATTENZIONE: le esecuzioni pianificate partono SOLO dal ramo predefinito del
# repository. Finche' questo file sta su un altro ramo, il backup va lanciato
# a mano da Actions > Backup notturno > Run workflow.

on:
  schedule:
    # 01:17 UTC = 03:17 in Italia con l'ora legale, 02:17 con l'ora solare.
    #
    # Il minuto dispari non e' un vezzo. GitHub non garantisce l'orario delle
    # esecuzioni pianificate: le accoda e le fa partire quando ha capacita'.
    # Gli slot all'ora esatta sono i piu' affollati, perche' ci scrivono tutti:
    # con '0 1 * * *' la primissima esecuzione non e' mai partita, nemmeno a
    # un'ora di distanza. Spostandosi lontano dal minuto zero si finisce in una
    # coda molto piu' corta.
    - cron: '17 1 * * *'
  # Quando cambia il backup stesso, si esegue subito: una modifica al codice del
  # backup va verificata quando la si fa, non la notte dopo. Serve anche a non
  # dipendere dalla coda delle pianificazioni per sapere se funziona.
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-notturno.yml'
      - 'scripts/backup/**'

  workflow_dispatch:
    inputs:
      includi_bundle:
        description: "Includere la storia git completa (pesante, di norma solo la domenica)"
        type: boolean
        default: false
      salta_video:
        description: "Saltare i video allegati alle release"
        type: boolean
        default: false

concurrency:
  group: backup-notturno
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Scarica il repository con tutta la storia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa le dipendenze del backup
        run: npm install --prefix scripts/backup --no-audit --no-fund

      - name: Esegui il backup
        id: backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARTELLA_BACKUP: ${{ github.workspace }}/backup-uscita
          INCLUDI_BUNDLE: ${{ inputs.includi_bundle && 'si' || '' }}
          SALTA_VIDEO: ${{ inputs.salta_video && 'si' || '' }}
        run: node scripts/backup/esegui-backup.cjs

      - name: Conserva la copia come allegato dell'esecuzione
        # Anche quando il backup segnala problemi: serve proprio a capire cosa
        # e' andato storto. La storia git completa resta fuori: GitHub ce l'ha
        # gia', copiarla dentro GitHub non aggiunge nessuna sicurezza.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ steps.backup.outputs.etichetta || github.run_id }}
          path: |
            backup-uscita/**
            !backup-uscita/**/repo-full.bundle
          retention-days: 90
          if-no-files-found: warn

      - name: Riepilogo
        if: always()
        run: |
          echo "### Backup notturno" >> "$GITHUB_STEP_SUMMARY"
          FILE=$(find backup-uscita -name report.txt | head -1)
          if [ -n "$FILE" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$FILE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nessun report prodotto: il backup si e' interrotto prima." >> "$GITHUB_STEP_SUMMARY"
          fi
